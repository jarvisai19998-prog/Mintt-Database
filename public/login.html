<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ElectricLead Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f14; --surface: #141720; --surface2: #1c2030; --border: #252a3a;
    --text: #e8eaf0; --text-muted: #6b7280; --text-dim: #9ca3af;
    --accent: #6366f1; --accent-glow: rgba(99,102,241,0.15);
    --green: #10b981; --green-bg: rgba(16,185,129,0.12);
    --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-wrap { width: 100%; max-width: 460px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 20px; padding: 8px 20px; font-weight: 600; font-size: 15px; color: var(--accent); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 28px; background: var(--surface2); border-radius: 10px; padding: 4px; }
  .tab-btn { flex: 1; padding: 9px; border: none; border-radius: 7px; background: transparent; color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-muted); }
  .plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .plan-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 10px; cursor: pointer; transition: all 0.15s; text-align: center; background: var(--surface2); }
  .plan-card:hover { border-color: var(--accent); }
  .plan-card.selected { border-color: var(--accent); background: var(--accent-glow); }
  .plan-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .plan-price { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1; }
  .plan-period { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .submit-btn { width: 100%; padding: 13px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 8px; }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
  .success-banner { background: var(--green-bg); border: 1px solid var(--green); border-radius: 10px; padding: 14px 18px; text-align: center; color: var(--green); font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="logo"><span class="logo-pill">⚡ ElectricLead Pro</span></div>

  <div id="success-banner" class="success-banner" style="display:none">
    Payment successful! Your account is active. Log in below.
  </div>

  <div class="auth-card">
    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="submit-btn" id="login-btn" onclick="handleLogin()">Log In</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- Signup form -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="signup-company" placeholder="Acme Electric" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 8 characters" />
      </div>
      <div class="form-group">
        <label>Choose Plan</label>
        <div class="plan-grid">
          <div class="plan-card selected" data-plan="starter" onclick="selectPlan('starter')">
            <div class="plan-name">Starter</div>
            <div class="plan-price">$97</div>
            <div class="plan-period">/month</div>
          </div>
          <div class="plan-card" data-plan="growth" onclick="selectPlan('growth')">
            <div class="plan-name">Growth</div>
            <div class="plan-price">$247</div>
            <div class="plan-period">/month</div>
          </div>
          <div class="plan-card" data-plan="agency" onclick="selectPlan('agency')">
            <div class="plan-name">Agency</div>
            <div class="plan-price">$597</div>
            <div class="plan-period">/month</div>
          </div>
        </div>
      </div>
      <button class="submit-btn" id="signup-btn" onclick="handleSignup()">Continue to Payment →</button>
      <div class="error-msg" id="signup-error"></div>
    </div>
  </div>
</div>

<script>
  let selectedPlan = 'starter';

  if (new URLSearchParams(location.search).get('payment') === 'success') {
    document.getElementById('success-banner').style.display = 'block';
  }

  // Redirect if already logged in
  if (localStorage.getItem('mintt_token')) window.location.replace('/admin.html');

  function switchTab(tab) {
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  }

  function selectPlan(plan) {
    selectedPlan = plan;
    document.querySelectorAll('.plan-card').forEach(c => c.classList.toggle('selected', c.dataset.plan === plan));
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed.'; return; }
      localStorage.setItem('mintt_token', data.token);
      localStorage.setItem('mintt_user', JSON.stringify(data.user));
      window.location.href = '/admin.html';
    } catch { errEl.textContent = 'Network error. Please try again.'; }
    finally { btn.disabled = false; btn.textContent = 'Log In'; }
  }

  async function handleSignup() {
    const companyName = document.getElementById('signup-company').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const errEl = document.getElementById('signup-error');
    const btn = document.getElementById('signup-btn');
    errEl.textContent = '';
    if (!companyName || !email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
    if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
    btn.disabled = true; btn.textContent = 'Setting up...';
    try {
      const res = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, companyName, plan: selectedPlan }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Signup failed.'; return; }
      window.location.href = data.checkoutUrl;
    } catch { errEl.textContent = 'Network error. Please try again.'; }
    finally { btn.disabled = false; btn.textContent = 'Continue to Payment →'; }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('form-login').style.display !== 'none';
    loginVisible ? handleLogin() : handleSignup();
  });
</script>
</body>
</html>
